name: Deploy Notification Engine to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Pass
        run: sudo apt-get install sshpass -y

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sshpass -p $SSH_KEY ssh -o StrictHostKeyChecking=no root@$SERVER_HOST "
          cd /home/ubuntu && \
          git stash && \
          git pull && \
          pnpm i && \
          pnpm run build
