name: Containerize & Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  containerize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build & Push the Image
        run: |
          docker login --username dnyaneshwar411 --password ${{ secrets.GHCR_PAT }}
          docker build . --tag ghcr.io/dnyaneshwar411/notification-engine:latest
          docker push hcr.io/dnyaneshwar411/notification-engine:latest


