deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Install Production Dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - run: pnpm install --prod --frozen-lockfile

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "dist/,package.json,node_modules/"
          target: "/var/www/my-app"

      - name: Restart Processes via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/my-app
            # Using PM2 to manage both your API and Worker independently
            pm2 delete all || true
            pm2 start dist/index.js --name "api-service"
            pm2 start dist/workers/init.js --name "worker-service"